services:
  # 1. Backend API & BullMQ Worker (Web Service)
  - type: web
    name: email-scheduler-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: cd backend && npm ci && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma db push && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: email-scheduler-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: email-scheduler-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://email-scheduler-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_COOKIE_NAME
        value: email_scheduler_token
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://email-scheduler-backend.onrender.com/api/auth/google/callback
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        value: https://email-scheduler-backend.onrender.com/api/slack/callback
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 100
      - key: MIN_DELAY_PER_SENDER_MS
        value: 2000
      - key: WORKER_CONCURRENCY
        value: 5
      - key: ADMIN_PASSWORD
        value: adminsecret

  # 2. Frontend React Application (Static Site)
  - type: web
    name: email-scheduler-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://email-scheduler-backend.onrender.com/api

  # 3. Redis Service
  - type: redis
    name: email-scheduler-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

# 4. Managed PostgreSQL Database
databases:
  - name: email-scheduler-postgres
    plan: free
    region: oregon
    databaseName: emailscheduler
    user: postgres

